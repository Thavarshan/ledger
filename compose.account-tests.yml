services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ledger_testing
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledger_testing"]
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - "5432:5432"
