name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]
  schedule:
    - cron: '17 3 * * 1'

# Configure this workflow as a required check named `CI / gate` on main.
# The deploy job runs only for published releases after this gate succeeds,
# ensuring production receives an explicitly versioned commit.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COMPOSER_NO_INTERACTION: '1'
  COMPOSER_NO_PROGRESS: '1'
  NODE_VERSION: '22'
  PHP_VERSION: '8.5'

jobs:
  php-quality:
    name: PHP quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --optimize-autoloader

      - name: Validate Composer configuration
        run: composer validate --strict --no-check-publish

      - name: Check PHP formatting
        run: vendor/bin/pint --test --format agent

      - name: Run PHP static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  frontend-quality:
    name: Frontend quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP for Wayfinder generation
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies for Wayfinder
        run: composer install --prefer-dist --optimize-autoloader

      - name: Generate Wayfinder types
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan wayfinder:generate --with-form --no-interaction

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check

      - name: Check lint
        run: |
          npx eslint . --fix
          npm run lint:check

      - name: Check TypeScript
        run: npm run types:check

      - name: Run frontend tests
        env:
          LARAVEL_BYPASS_ENV_CHECK: '1'
        run: npm run test:frontend

      - name: Build frontend assets
        run: npm run build

  backend-tests:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend assets for feature tests
        run: npm run build

      - name: Configure Laravel test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan config:clear

      - name: Run PHPUnit suite
        run: php artisan test --compact

  postgres-finance:
    name: Finance tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ledger_testing
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ledger_testing"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --optimize-autoloader

      - name: Setup Node for feature assets
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build frontend assets for PostgreSQL tests
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Run PostgreSQL finance tests
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: php vendor/bin/phpunit --configuration=phpunit.finance.xml --no-coverage

  security:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress

      - name: Audit Composer dependencies
        run: composer audit --locked

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts --no-fund

      - name: Audit npm dependencies
        run: npm audit --omit=dev --audit-level=high

  gate:
    name: Deployment gate
    if: ${{ always() }}
    needs:
      - php-quality
      - frontend-quality
      - backend-tests
      - postgres-finance
      - security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to pass
        env:
          PHP_QUALITY: ${{ needs.php-quality.result }}
          FRONTEND_QUALITY: ${{ needs.frontend-quality.result }}
          BACKEND_TESTS: ${{ needs.backend-tests.result }}
          POSTGRES_FINANCE: ${{ needs.postgres-finance.result }}
          SECURITY: ${{ needs.security.result }}
        run: |
          printf 'PHP quality: %s\nFrontend quality: %s\nBackend tests: %s\nPostgreSQL finance: %s\nSecurity: %s\n' \
            "${PHP_QUALITY}" "${FRONTEND_QUALITY}" "${BACKEND_TESTS}" "${POSTGRES_FINANCE}" "${SECURITY}"
          test "${PHP_QUALITY}" = success
          test "${FRONTEND_QUALITY}" = success
          test "${BACKEND_TESTS}" = success
          test "${POSTGRES_FINANCE}" = success
          test "${SECURITY}" = success

  deploy:
    name: Deploy production
    if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Laravel Cloud deployment
        run: >-
          curl --fail --show-error --request POST
          "${{ secrets.LARAVEL_CLOUD_DEPLOY_HOOK }}?commit_hash=${{ github.sha }}"
