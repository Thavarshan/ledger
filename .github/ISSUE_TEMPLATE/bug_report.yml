name: Bug report
description: Report a reproducible problem in Ledger.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, personal financial data, or production database exports.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the smallest set of steps that reproduces the problem.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Runtime versions
      placeholder: PHP, Node.js, database, browser, and OS versions
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact secrets and personal data before sharing logs.
      render: shell
