name: Feature request
description: Propose a focused improvement to Ledger.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful solution and alternatives considered.
    validations:
      required: true
  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
